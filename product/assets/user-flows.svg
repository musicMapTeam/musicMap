<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1100" viewBox="0 0 1080 1100" role="img" aria-labelledby="title desc">
<title id="title">Music Map 用户流程总览</title><desc id="desc">三列展示自由漫游、沿途发现与合作挑战。详细异常分支和回退规则见用户流程文档。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#8e819b" stroke-width="1.2"/></marker><style>text{font-family:'Microsoft YaHei','PingFang SC',sans-serif;fill:#30283e}.title{font-size:35px;font-weight:600}.sub{font-size:15px;fill:#716b77}.label{font-size:19px;font-weight:600}.small{font-size:13px;fill:#716b77}.card{fill:#fffcf7;stroke:#ded9d4}.flow{stroke:#8e819b;stroke-width:1.4;fill:none;marker-end:url(#arrow)}.step{font-size:16px}.accent{fill:#ae4e39}</style></defs>
<rect width="1080" height="1100" fill="#f5f2eb"/>
<text x="52" y="64" class="small accent">MUSIC MAP / PRODUCT FLOW / V0.2</text><text x="52" y="116" class="title">从喜欢出发，把发现留下。</text><text x="52" y="152" class="sub">手机网页 · 不接账号 · 不外跳 · 创新音乐产品赛道</text>
<g transform="translate(45 200)"><rect width="310" height="738" rx="22" fill="#ede6ef"/><text x="24" y="42" class="label">01 自由漫游</text>
<rect x="20" y="68" width="270" height="70" rx="12" class="card"/><text x="155" y="99" text-anchor="middle" class="step">搜索 / 选择起点</text><text x="155" y="122" text-anchor="middle" class="small">无结果 → 改选已收录艺人</text><path d="M155 140V163" class="flow"/>
<rect x="20" y="174" width="270" height="90" rx="12" class="card"/><text x="155" y="205" text-anchor="middle" class="step">进入空间关系网</text><text x="155" y="231" text-anchor="middle" class="small">拖动旋转 / 点邻居换中心</text><text x="155" y="251" text-anchor="middle" class="small">合作与风格可切换</text><path d="M155 267V289" class="flow"/>
<rect x="20" y="300" width="270" height="85" rx="12" class="card"/><text x="155" y="330" text-anchor="middle" class="step">点中心展开代表作</text><text x="155" y="355" text-anchor="middle" class="small">主动试听 / 随手留下歌曲</text><text x="155" y="376" text-anchor="middle" class="small">再点中心收起，继续探索</text><path d="M155 388V411" class="flow"/>
<rect x="20" y="422" width="270" height="85" rx="12" class="card"/><text x="155" y="453" text-anchor="middle" class="step">上一位 / 回到起点</text><text x="155" y="478" text-anchor="middle" class="small">调整当前路线，保留完整轨迹</text><text x="155" y="497" text-anchor="middle" class="small">已留下歌曲不丢失</text><path d="M155 510V534" class="flow"/>
<rect x="20" y="545" width="270" height="70" rx="12" fill="#30283e"/><text x="155" y="576" text-anchor="middle" style="fill:#fff9ed;font-size:17px">结束探索 → 回顾</text><text x="155" y="600" text-anchor="middle" style="fill:#e8d9ef;font-size:12px">即使没有留下歌曲，也可以结束</text>
<text x="25" y="665" class="small">每条连线都有依据。</text><text x="25" y="690" class="small">快捷回退不伪造成新的合作。</text></g>
<g transform="translate(385 200)"><rect width="310" height="738" rx="22" fill="#ebeade"/><text x="24" y="42" class="label">02 沿途发现</text>
<rect x="20" y="68" width="270" height="70" rx="12" class="card"/><text x="155" y="99" text-anchor="middle" class="step">主动点击“留下”</text><text x="155" y="122" text-anchor="middle" class="small">试听和浏览不自动加入歌曲清单</text><path d="M155 140V163" class="flow"/>
<rect x="20" y="174" width="270" height="90" rx="12" class="card"/><text x="155" y="205" text-anchor="middle" class="step">本次发现 · N 首</text><text x="155" y="231" text-anchor="middle" class="small">随时查看 / 关闭回到原锚点</text><text x="155" y="251" text-anchor="middle" class="small">移除可撤销，按歌曲版本去重</text><path d="M155 267V289" class="flow"/>
<rect x="20" y="300" width="270" height="85" rx="12" class="card"/><text x="155" y="330" text-anchor="middle" class="step">结束后集中回顾</text><text x="155" y="355" text-anchor="middle" class="small">先展示留下的歌曲</text><text x="155" y="376" text-anchor="middle" class="small">再展开路线与途经艺人</text><path d="M155 388V411" class="flow"/>
<rect x="20" y="422" width="270" height="85" rx="12" class="card"/><text x="155" y="453" text-anchor="middle" class="step">我的发现 / 本地保存</text><text x="155" y="478" text-anchor="middle" class="small">同一会话更新，不重复生成</text><text x="155" y="497" text-anchor="middle" class="small">删除前确认具体记录</text><path d="M155 510V534" class="flow"/>
<rect x="20" y="545" width="270" height="70" rx="12" fill="#30283e"/><text x="155" y="576" text-anchor="middle" style="fill:#fff9ed;font-size:17px">继续本次 / 从 TA 再出发</text><text x="155" y="600" text-anchor="middle" style="fill:#e8d9ef;font-size:12px">继续原记录 / 新建空清单</text>
<text x="25" y="665" class="small">漫游与挑战分别保存。</text><text x="25" y="690" class="small">不依赖平台歌单或用户账号。</text></g>
<g transform="translate(725 200)"><rect width="310" height="738" rx="22" fill="#f0e3d9"/><text x="24" y="42" class="label">03 步数挑战</text>
<rect x="20" y="68" width="270" height="70" rx="12" class="card"/><text x="155" y="99" text-anchor="middle" class="step">自选起点与终点</text><text x="155" y="122" text-anchor="middle" class="small">相同 / 不可达 → 提示重新选择</text><path d="M155 140V163" class="flow"/>
<rect x="20" y="174" width="270" height="90" rx="12" class="card"/><text x="155" y="205" text-anchor="middle" class="step">沿合作关系开始</text><text x="155" y="231" text-anchor="middle" class="small">固定本局图谱 / 起始 0 步</text><text x="155" y="251" text-anchor="middle" class="small">不限时、不限步数</text><path d="M155 267V289" class="flow"/>
<rect x="20" y="300" width="270" height="85" rx="12" class="card"/><text x="155" y="330" text-anchor="middle" class="step">每走一条关系 +1 步</text><text x="155" y="355" text-anchor="middle" class="small">快捷返回 −1 / 回起点归零</text><text x="155" y="376" text-anchor="middle" class="small">中途退出保留“未完成”</text><path d="M155 388V411" class="flow"/>
<rect x="20" y="422" width="270" height="85" rx="12" class="card"/><text x="155" y="453" text-anchor="middle" class="step">到达目标：X 步到达！</text><text x="155" y="478" text-anchor="middle" class="small">展示最终路线与连接作品</text><text x="155" y="497" text-anchor="middle" class="small">已撤销分支不计步</text><path d="M155 510V534" class="flow"/>
<rect x="20" y="545" width="270" height="70" rx="12" fill="#30283e"/><text x="155" y="576" text-anchor="middle" style="fill:#fff9ed;font-size:17px">再次挑战 / 返回漫游</text><text x="155" y="600" text-anchor="middle" style="fill:#e8d9ef;font-size:12px">新局重新选择 / 优先恢复原漫游</text>
<text x="25" y="665" class="small">歌曲是依据，不是额外节点。</text><text x="25" y="690" class="small">结果不声称是最短路径。</text></g>
<path d="M52 982H1028" stroke="#ded9d4"/><text x="52" y="1018" class="small">本图展示主要路径，完整循环、异常与状态约定见 docs/02-user-flows.md 和 PRD v0.2。</text><text x="52" y="1049" class="small">可点击原型使用虚构示例与模拟试听；正式版本的数据与音频需另行核验。</text>
</svg>
