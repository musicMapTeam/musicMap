name: Prepare storage-fix Pages release

on:
  push:
    branches: [main]
    paths: ['.github/workflows/prepare-storage-release.yml']

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      SOURCE_SHA: 99913a9c09373f5ee7085eded5699df5869015cb
      EXPECTED_PARENT: e710bf8517476f0c86271b658a3ae1efb7c5f621
      EXPECTED_HTML_SHA256: 2598c6c478746db645e4cbf91aefe7e2e0fd9708ca756525f9afc09dfb15b3cc
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: 99913a9c09373f5ee7085eded5699df5869015cb
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - name: Prepare immutable Git objects without publishing
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          printf '%s  dist/index.html\n' "$EXPECTED_HTML_SHA256" | sha256sum --check
          test "$(wc -c < dist/index.html)" = "1426010"
          REPO=musicMapTeam/musicMap
          PARENT=$(gh api "repos/$REPO/git/ref/heads/gh-pages" --jq .object.sha)
          test "$PARENT" = "$EXPECTED_PARENT"
          python3 - <<'PY'
          import base64, json
          from pathlib import Path
          Path('/tmp/release-blob.json').write_text(json.dumps({
              'encoding': 'base64',
              'content': base64.b64encode(Path('dist/index.html').read_bytes()).decode()
          }))
          PY
          HTML=$(gh api "repos/$REPO/git/blobs" --input /tmp/release-blob.json --jq .sha)
          test "$HTML" = "dbb2f2d9863b79668bd7657c97ba2c9af683627a"
          EMPTY=$(printf '%s' '{"encoding":"utf-8","content":""}' | gh api "repos/$REPO/git/blobs" --input - --jq .sha)
          TREE=$(jq -n --arg h "$HTML" --arg e "$EMPTY" '{tree:[{path:"index.html",mode:"100644",type:"blob",sha:$h},{path:".nojekyll",mode:"100644",type:"blob",sha:$e}]}' | gh api "repos/$REPO/git/trees" --input - --jq .sha)
          COMMIT=$(jq -n --arg t "$TREE" --arg p "$PARENT" --arg m "Deploy Music Map storage protection from main@$SOURCE_SHA" '{message:$m,tree:$t,parents:[$p]}' | gh api "repos/$REPO/git/commits" --input - --jq .sha)
          jq -n --arg source "$SOURCE_SHA" --arg parent "$PARENT" --arg tree "$TREE" --arg commit "$COMMIT" --arg blob "$HTML" --arg sha256 "$EXPECTED_HTML_SHA256" '{source:$source,parent:$parent,tree:$tree,commit:$commit,blob:$blob,sha256:$sha256,size:1426010}' | tee /tmp/storage-release-manifest.json
          echo "Prepared commit: $COMMIT" >> "$GITHUB_STEP_SUMMARY"
          echo 'No branch reference was changed. Publish only after verifying this manifest.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: storage-release-manifest
          path: /tmp/storage-release-manifest.json
          retention-days: 7
