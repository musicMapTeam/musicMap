name: Build demo

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: music-map-demo
          path: |
            dist/index.html
            README.md
            RUN-ME.md
            THIRD_PARTY_NOTICES.md
          retention-days: 14
