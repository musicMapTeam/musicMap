<!doctype html>
<html lang="zh-CN" data-resolution="landscape">
<head><meta charset="utf-8"><meta name="viewport" content="width=1920, height=1080"><title>Music Map × Music Space · 参赛封面</title><script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script><style>
    @font-face { font-family: "Microsoft YaHei"; src: local("Microsoft YaHei"); font-weight: 400; }
    @font-face { font-family: "Microsoft YaHei"; src: local("Microsoft YaHei Bold"); font-weight: 700 900; }
    @font-face { font-family: "Consolas"; src: local("Consolas"); font-weight: 400; }
    @font-face { font-family: "Consolas"; src: local("Consolas Bold"); font-weight: 700; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 1920px; height: 1080px; overflow: hidden; background: #0c1016; }
    body { font-family: "Microsoft YaHei", sans-serif; color: #f2efe7; }
    :root { --ink: #0c1016; --paper: #f2efe7; --mint: #70ddcf; --coral: #ff7e59; --muted: #b5c4c1; }
    #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; }
    .scene { position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--ink); }
    .scene:not(:first-child) { opacity: 0; }
    .scene-content { position: relative; display: flex; flex-direction: column; width: 100%; height: 100%; padding: 52px 72px 42px; gap: 24px; box-sizing: border-box; }
    .masthead { display: flex; align-items: center; justify-content: space-between; gap: 32px; min-height: 53px; padding-bottom: 19px; border-bottom: 1px solid #f2efe746; }
    .wordmark { font: 700 26px Consolas, "Microsoft YaHei", monospace; letter-spacing: -.045em; }
    .wordmark em { color: var(--mint); font-style: normal; }
    .edition { font-size: 21px; font-weight: 400; letter-spacing: .06em; color: var(--muted); }
    .scene-grid { display: grid; grid-template-columns: 448px 1fr; gap: 48px; align-items: center; flex: 1; min-height: 0; }
    .copy { display: flex; flex-direction: column; gap: 27px; min-width: 0; }
    .step { font: 400 23px Consolas, "Microsoft YaHei", monospace; letter-spacing: .06em; color: var(--mint); }
    h2 { font-size: 78px; line-height: 1.23; letter-spacing: -.055em; font-weight: 900; max-width: 448px; }
    h2 em { display: block; color: var(--coral); font-style: normal; }
    .body-copy { font-size: 29px; line-height: 1.75; font-weight: 400; color: var(--muted); max-width: 438px; }
    .notes { display: flex; flex-direction: column; gap: 14px; margin-top: 5px; }
    .notes p { font-size: 23px; line-height: 1.6; color: var(--paper); }
    .notes p::before { content: '—'; color: var(--mint); margin-right: 14px; }
    .screen { min-width: 0; display: flex; align-items: center; justify-content: center; width: 100%; height: 724px; }
    .screen img { display: block; max-width: 100%; max-height: 100%; width: auto; height: auto; object-fit: contain; border: 1px solid #f2efe741; }
    .screen--ticket { position: relative; gap: 40px; }
    .screen--ticket img { max-height: 738px; box-shadow: 0 22px 60px #0006; }
    .image-tag { font-size: 22px; color: var(--mint); writing-mode: vertical-rl; letter-spacing: .12em; }
    .subtitle { padding-top: 24px; border-top: 1px solid #f2efe746; display: flex; justify-content: space-between; align-items: center; gap: 36px; min-height: 91px; }
    .subtitle p { font-size: 30px; line-height: 1.55; font-weight: 400; color: var(--paper); max-width: 1430px; }
    .folio { font: 400 24px Consolas, monospace; white-space: nowrap; color: var(--muted); letter-spacing: .04em; }
    .opart { position: absolute; width: 630px; height: 630px; border-radius: 50%; background: repeating-radial-gradient(circle at center, transparent 0 11px, #70ddcf 12px 14px, transparent 15px 24px); opacity: .12; right: -260px; top: -300px; pointer-events: none; }
    .opart--coral { background: repeating-radial-gradient(circle at center, transparent 0 11px, #ff7e59 12px 14px, transparent 15px 24px); top: auto; bottom: -430px; right: 290px; width: 740px; height: 740px; }
    .intro-grid { grid-template-columns: 900px 1fr; gap: 64px; }
    .intro-title { display: flex; flex-direction: column; gap: 16px; font-size: 116px; line-height: 1.12; letter-spacing: -.06em; font-weight: 900; }
    .intro-title span:last-child { color: var(--mint); }
    .intro-copy { font-size: 34px; color: var(--muted); line-height: 1.6; max-width: 750px; }
    .intro-product { display: flex; gap: 24px; align-items: center; margin-top: 25px; }
    .intro-product b { font-size: 24px; font-weight: 700; padding: 12px 19px; border: 1px solid var(--coral); color: var(--coral); }
    .intro-product span { font-size: 24px; color: var(--muted); }
    .intro-art { position: relative; display: flex; align-items: center; justify-content: center; width: 100%; height: 744px; }
    .intro-art img { height: 705px; width: auto; transform: rotate(4deg); box-shadow: 20px 30px 70px #0005; border: 1px solid #f2efe7; }
    .intro-art .stamp { position: absolute; right: 0; bottom: 34px; font: 700 21px Consolas, "Microsoft YaHei", monospace; padding: 14px 18px; transform: rotate(-5deg); background: var(--coral); color: var(--ink); }
    .scene--ticket .copy { gap: 23px; }
    .scene--ticket h2 { font-size: 85px; }
    .scene--live .step { color: var(--coral); }
    .scene--mobile .scene-grid { grid-template-columns: 566px 1fr; gap: 70px; }
    .scene--mobile h2 { max-width: 566px; font-size: 89px; }
    .scene--mobile .body-copy { max-width: 536px; }
    .mobile-gallery { display: flex; justify-content: center; align-items: center; gap: 78px; height: 728px; }
    .phone-shot { height: 724px; width: auto; border: 1px solid #70ddcf91; box-shadow: 18px 18px 0 #70ddcf13; }
    .mini-ticket { height: 552px; width: auto; transform: rotate(4deg); }
    .outro-grid { display: flex; flex-direction: column; justify-content: center; align-items: start; gap: 32px; flex: 1; }
    .outro-title { font-size: 111px; font-weight: 900; letter-spacing: -.055em; line-height: 1.2; max-width: 1550px; }
    .outro-title em { display: inline; font-style: normal; color: var(--mint); }
    .outro-summary { font-size: 34px; color: var(--muted); line-height: 1.7; max-width: 1400px; }
    .scope { display: grid; grid-template-columns: 1fr 1fr; gap: 16px 60px; width: 1480px; margin-top: 28px; padding-top: 28px; border-top: 1px solid #70ddcf5a; }
    .scope p { font-size: 27px; line-height: 1.7; color: var(--paper); }
    .scope b { color: var(--coral); font-weight: 600; margin-right: 18px; }
    .outro-opart { position: absolute; bottom: -310px; right: -120px; width: 790px; height: 790px; opacity: .2; }
  </style><style>.intro-copy { max-width: 900px; font-size: 34px; } .intro-copy p { white-space: nowrap; } .intro-product { margin-top: 20px; } .intro-art { height: 790px; } .intro-art img { height: 744px; }</style></head>
<body><div id="root" data-composition-id="music-cover" data-start="0" data-duration="3" data-width="1920" data-height="1080">  <section id="cover-scene" class="scene" data-layout-allow-overflow style="z-index:1">
    <div class="opart" data-layout-ignore></div><div class="opart opart--coral" data-layout-ignore></div>
    <div class="scene-content">
      <header class="masthead"><span class="wordmark">MUSIC MAP <em>×</em> MUSIC SPACE</span><span class="edition">MVP 0.2 / 2026</span></header>
      <div class="scene-grid intro-grid">
        <div class="copy"><p class="step">DISCOVER. MEET. REMEMBER.</p><h1 class="intro-title"><span>从一首歌。</span><span>到同场的人。</span></h1><div class="intro-copy"><p>沿音乐关系，发现新声音。</p><p>用一张现场卡，交换另一种目光。</p></div><div class="intro-product"><b>音乐探索 × 现场社交</b></div></div>
        <div class="intro-art"><img src="assets/ticket.png" alt="应用实际导出的双人纪念票"></div>
      </div>
    </div>
  </section>
</div><script>
window.__timelines = window.__timelines || {};
const tl = gsap.timeline({paused:true});
tl.from('.masthead',{opacity:0,y:-10,duration:.3,ease:'sine.out'},.1);
tl.from('.step',{opacity:0,x:-12,duration:.35,ease:'power2.out'},.15);
tl.from('.intro-title',{opacity:0,y:30,duration:.55,ease:'expo.out'},.2);
tl.from('.intro-copy',{opacity:0,y:18,duration:.45,ease:'power3.out'},.3);
tl.from('.intro-product',{opacity:0,x:12,duration:.4,ease:'circ.out'},.4);
tl.from('.intro-art',{opacity:0,x:30,duration:.6,ease:'power4.out'},.3);
tl.from('.opart',{opacity:0,scale:.97,duration:.6,ease:'sine.out'},.15);
window.__timelines['music-cover']=tl;
</script></body></html>
